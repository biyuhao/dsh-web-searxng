# dsh-web-searxng — bundle layer
# 安装方式: dsh plugin --profile web add /path/to/dsh-web-searxng
# 或发 npm 包后: dsh plugin --profile web add dsh-web-searxng
#
# 只有 HOST 行是 loader 入口（specifier 字段是 `name:`）。浏览器 half 由
# package.json#dsh.client 自动发现、下发到 /plugins/dsh-web-searxng/client.js，
# 不要加第二行 loader（会把浏览器代码跑在 host 里）。
#
# entry id 即 settings namespace（volatile Config 字段投成 `searxng` 节，
# probe/instances 通道字段同走此 entry，不另设 loader 行）；改名会同时
# 破坏 settings UI 与 client 卡片两端。
- insert:
    - id: searxng
      name: dsh-web-searxng
      config:
        baseURL: !!js process.env.SEARXNG_BASE_URL
        username: !!js process.env.SEARXNG_USERNAME
        password: !!js process.env.SEARXNG_PASSWORD
        categories: general
        language: zh-CN
        safesearch: 1
        # 出境代理（出境受限机器必填；settings 卡片同名字段覆盖它）：
        proxyUrl: !!js process.env.SEARXNG_PROXY_URL
        # 代理启用开关（settings 卡片勾选框覆盖它；SEARXNG_PROXY_ENABLED=0/false/off 可默认关闭）：
        proxyEnabled: true
